syntax = "proto3";

package Common;
option go_package = "proto/Common";

// 增删改查
enum Motify { 
    QUERYS = 0;
	CREATE = 1;
	DELETE = 2;
	CHANGE = 4; 
}

// 通用状态
enum Status {
    QUERY     = 0; 
    JOIN      = 1; //参加、加入、请求加分
    EXIT      = 2; //退出、取消、请求下分
    WAIT      = 4; //等待审批、等待发货
    FAIL      = 8; //流程失败
    VERIFY    = 16; //人工审核
    REJECT    = 32; //人工拒绝
    CANCEL    = 64; //取消
    OVER      = 128; //成功、正常结束
}

enum ERROR {
    SUCCESS = 0;
    E_FAIL = -1;

    // GameService
    E_TABLE_NOT_EXISTS = -2;

    E_GAME_PLAYING   = -11; //玩家正在游戏对局中或未从第三方退出

    E_ALLOCATE_NO_TABLE = -100;
    E_PLAYER_NO_PLAYING_TABLE = -101;  // 玩家没有正在玩的游戏(可能是玩家连游服时游戏已经结束了)
    E_PLAYER_IN_CANCEL = -102;  // 解散中

    // GateService
    E_GATE_KICK_SERVER_CLOSED = -200;       // 服务器维护
    E_GATE_KICK_DUPLICATE_LOGIN = -201;     // 重复登录
    E_ANTI_ADDICTION_NO_REALNAME = -202;    // 防沉迷未实名认证
    E_ANTI_ADDICTION_NOT_PLAY_TIME = -203;  // 防沉迷不在游戏时间段
    E_GATE_KICK_BANNED = -204;              // 账号被封禁,strMsg内容为封禁到期时间戳, {"until":1666064543}

    // MatchMaker
    E_MM_ALREADY_HAVE_TICKET = -1000;      // 已经在匹配中(ticket已创建，还没生成match)
    E_MM_HAS_TABLE_TO_PLAY = -1001;        // 有匹配的桌子还没打完
    E_MM_STILL_MATCHING = -1002;           // 已经在匹配中(已经生成match，还没匹配到足够的人)
    E_MM_TICKET_NOT_EXIST = -1003;         // 没有开始过匹配
    E_MM_GAME_MONEY_OUT_OF_RANGE = -1004;  // 游戏币超出限制范围
    E_MM_PLAYER_OVER = -1101;   // 人满了
    E_MM_PLAYER_EMPTY = -1102;  // 人不满
    E_MM_ALREADY_START = -1103; // 游戏已经开始了
    E_MM_NUMS_FULL     = -1104; // 创建的桌子数满了

    // Currency
    E_CY_LOCK_FAILED = -2000;
    E_CY_NOT_LOCKED = -2001;
    E_CY_LOCKED = -2002;
    E_CY_NOT_ENOUGH = -2003;

    // Task
    E_TASK_NOT_EXISTS = -3000;        // 任务不存在
    E_TASK_ALREADY_ACCEPTED = -3001;  // 任务已经接过了

    // Award
    E_AWARD_NOT_EXISTS = -4000;  // 奖励id不存在

    // Relieve
    E_RELIEVE_TOO_MUCH_MONEY = -5000;    // 钱足够了，不能领取救济金
    E_RELIEVE_NOT_ENOUGH_TIMES = -5001;  // 剩余次数不足

    // Signin
    E_SIGNIN_HAS_SIGNINED_TODAY = -6001;        // 今天已经签到过了
    E_SIGNIN_NOT_SIGNINED_TODAY = -6002;        // 今天还没签到，不能预约
    E_SIGNIN_CANT_PRESIGNIN_ON_SUNDAY = -6003;  // 周日不能预约
    E_SIGNIN_ALREADY_PRESIGNINED = -6004;       // 已经预约过了

    // Ranking
    E_RANKING_GIFT_NOT_ENOUGH_SCORE = -7000;  // 积分不够不能领取
    E_RANKING_GIFT_STILL_COOLDOWN = -7001;    // 还在冷却中

    // ShakeShake
    E_SHAKE_NOT_ENOUGH_SHAKE_TIMES = -9001;  // 今天摇一摇次数用完

    // LoginAward
    E_LOGIN_AWARD_NOT_EXIST_IN_CONFIG = -10001;  // 配置文件中没有对应的奖励id
    E_LOGIN_AWARD_HAS_APPLYED = -10002;          // 今天已领取过该时间段奖励

    // VIP
    E_VIP_AWARD_HAS_BEEN_RECEIVED = -11001;           // 奖励已经领取过了
    E_VIP_LEVEL_NOT_ENOUGH = -11002;                  // vip等级不足
    E_VIP_NO_DAILY_AWARD_FOR_CURRENT_LEVEL = -11003;  // 当前vip等级没有每日奖励
    E_VIP_BET_NOT_ENOUGH = -11004;  // 当前vip等级没有每日奖励

