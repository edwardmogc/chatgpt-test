    BULLETIN_NOTI = 16001;          // 跑马灯通知 Bulletin.BulletinNoti
    ROULETTE_INFO_NOTI = 17001;     // 大转盘通知
    LOGIN_AWARD_INGO_NOTI = 18001;  // 定时登陆通知
