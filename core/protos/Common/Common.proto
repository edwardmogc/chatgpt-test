    E_TUTORIAL_ALREADY_COMPLETED = -12001;  // 引导已经完成过了

    // RedeemCode
    E_REDEEM_CODE_NOT_EXISTS = -12100;        // 兑换码不存在
    E_REDEEM_CODE_ALREADY_REDEEMED = -12101;  // 玩家已经兑换过该兑换码了
    E_REDEEM_CODE_ALREADY_USED = -12102;      // 兑换码已经被别人用过了
    E_REDEEM_CODE_WRONG_SOURCE = -12103;      // 兑换码和玩家渠道不一致
    E_REDEEM_CODE_ALREADY_TYPE = -12104;      // 已经兑换过同类型兑换码了
