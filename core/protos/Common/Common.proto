    // Invite
    E_INVITE_NO_ID_CARD = -12200;            // 还没有实名认证
    E_INVITE_NOT_ENOUGH_LEVEL = -12201;      // 玩家等级不足
    E_INVITE_WRONG_CODE = -12202;            // 错误的邀请码
    E_INVITE_ALREADY_HAVE_INVITER = -12203;  // 已经输入过邀请码了
    E_INVITE_CAN_NOT_INVITE_SELF = -12204;   // 不能邀请自己

    E_AD_REWARD_TIMES_LIMITED = -12300;  // 激励视频次数超过上限了

    // Rebate 
    E_REBATE_NONE_AWARD     =  -12401; //没有奖励     
    // Exchange 
    E_EXCHANGE_LIMIT     =  -12501; //当天限制     
    E_EXCHANGE_PAY       =  -12502; //兑换失败
    E_EXCHANGE_UNMOTIFY  =  -12503; //修改限制，每月修改一次
    E_EXCHANGE_LESS      =  -12504; //每日提现额度不足
    E_EXCHANGE_RENAME    =  -12505; //名称重复
    E_EXCHANGE_BETLESS   =  -12506; //投注额度不足
    E_EXCHANGE_TIMES     =  -12507; //提现次数限制
}

enum CommonNotifyOpcode {
